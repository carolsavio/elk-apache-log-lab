filebeat.inputs:
  - type: log
    enabled: true
    paths:
      - /var/log/apache2/access.log
    fields:
      log_type: apache_access

  - type: log
    enabled: true
    paths:
      - /var/log/apache2/error.log
    fields:
      log_type: apache_error

output.logstash:
  hosts: ["localhost:5044"]

logging.level: info
logging.to_files: true
logging.files:
  path: /var/log/filebeat
  name: filebeat
  keepfiles: 7

tags: ["apache", "lab", "elk"]