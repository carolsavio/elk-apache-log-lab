# =============================================================
# Logstash Pipeline — Apache Access & Error Logs
# ATENÇÃO: Este arquivo é mantido como referência documental.
# Na arquitetura final do lab, o Logstash foi substituído pelo
# módulo Apache nativo do Filebeat devido à limitação de RAM
# do t3.micro (1GB). Para usar este pipeline, recomenda-se
# uma instância com mínimo 4GB de RAM.
# =============================================================

input {
  beats {
    port => 5044
    host => "0.0.0.0"
  }
}

# -------------------------------------------------------------
filter {
  # Processar access log do Apache (formato Combined Log Format)
  if [fields][log_type] == "apache_access" {
    grok {
      match => {
        "message" => "%{COMBINEDAPACHELOG}"
      }
      tag_on_failure => ["_grokparsefailure_access"]
    }

    # Converter campos numéricos
    mutate {
      convert => {
        "bytes"    => "integer"
        "response" => "integer"
      }
    }

    # Parsear data/hora do Apache para @timestamp
    date {
      match => ["timestamp", "dd/MMM/yyyy:HH:mm:ss Z"]
      target => "@timestamp"
      remove_field => ["timestamp"]
    }

    # Adicionar categoria de status HTTP
    if [response] {
      if [response] >= 500 {
        mutate { add_field => { "status_category" => "5xx Server Error" } }
      } else if [response] >= 400 {
        mutate { add_field => { "status_category" => "4xx Client Error" } }
      } else if [response] >= 300 {
        mutate { add_field => { "status_category" => "3xx Redirect" } }
      } else if [response] >= 200 {
        mutate { add_field => { "status_category" => "2xx Success" } }
      }
    }

    # GeoIP — CORREÇÃO: target obrigatório no ECS v8
    # Erro original: "requires a `target` when `source` is not an `ip` sub-field"
    geoip {
      source => "clientip"
      target => "geoip"
    }

    # Parsear User-Agent
    useragent {
      source => "agent"
      target => "user_agent"
    }

    mutate {
      add_field => { "log_type" => "apache_access" }
    }
  }

  # Processar error log do Apache
  if [fields][log_type] == "apache_error" {
    grok {
      match => {
        "message" => [
          '\[%{HTTPDERROR_DATE:timestamp}\] \[%{WORD:module}:%{LOGLEVEL:log_level}\] \[pid %{NUMBER:pid}\] %{GREEDYDATA:error_message}',
          '\[%{HTTPDERROR_DATE:timestamp}\] \[%{LOGLEVEL:log_level}\] \[client %{IPORHOST:clientip}:%{NUMBER:clientport}\] %{GREEDYDATA:error_message}'
        ]
      }
      tag_on_failure => ["_grokparsefailure_error"]
    }

    date {
      match => ["timestamp", "EEE MMM dd HH:mm:ss.SSSSSS yyyy"]
      target => "@timestamp"
      remove_field => ["timestamp"]
    }

    mutate {
      add_field => { "log_type" => "apache_error" }
    }
  }

  # Remover campos desnecessários
  mutate {
    remove_field => ["host", "ecs", "input"]
  }
}

# -------------------------------------------------------------
output {
  elasticsearch {
    hosts    => ["https://localhost:9200"]
    user     => "elastic"
    password => "<SUA-SENHA-AQUI>"
    index    => "apache-logs-%{+YYYY.MM.dd}"
    ssl_enabled => true
    ssl_verification_mode => none
  }

  # Debug: descomentar para ver os eventos no terminal
  # stdout {
  #   codec => rubydebug
  # }
}
